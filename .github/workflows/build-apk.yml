name: Build Android Debug APK

# Trigger workflow on pushes to main or master branches and manual execution from GitHub UI
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java JDK environment (JDK 17 for modern Android Gradle Plugin & Kotlin)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Set up Gradle Action (improves caching and build reliability)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Step 4: Fix CRLF line endings (for Windows pushes) and grant execute permission
      - name: Fix Line Endings and Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      # Step 5: Ensure Gradle Wrapper JAR is valid (test JAR execution; regenerate if corrupted)
      - name: Ensure Valid Gradle Wrapper
        run: |
          mkdir -p gradle/wrapper
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! java -jar gradle/wrapper/gradle-wrapper.jar --version >/dev/null 2>&1; then
            echo "Gradle wrapper JAR is missing or corrupt. Regenerating with system Gradle..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            gradle wrapper --gradle-version 9.3.1 --distribution-type bin
          else
            echo "Gradle wrapper JAR validated successfully."
          fi

      # Step 6: Create fallback .env file for Secrets Gradle plugin if missing
      - name: Prepare Environment File
        run: |
          if [ ! -f ".env" ]; then
            cp .env.example .env 2>/dev/null || touch .env
          fi

      # Step 7: Build Debug APK using Gradle wrapper
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 8: Upload generated Debug APK as GitHub Action artifact for download
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30